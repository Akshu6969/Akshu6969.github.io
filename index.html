<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Ashrai Gandikota</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Base Styles */
        body {
            background-color: #eef2f6; 
            font-family: 'Inter', 'Century Gothic', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #4a5568; 
        }
        .portfolio-container {
            display: flex;
            width: 85%;
            max-width: 1000px;
            height: 85vh;
            align-items: flex-start;
            flex-direction: row; 
        }
        
        /* Sidebar Navigation Tabs */
        .sidebar {
            display: flex;
            flex-direction: column;
            margin-top: 40px;
            z-index: 1;
        }
        .tab {
            background-color: #cbd5e1; 
            color: #64748b;
            padding: 16px 12px;
            margin-bottom: 6px;
            border-radius: 0 10px 10px 0; 
            text-decoration: none;
            writing-mode: vertical-rl; 
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.02);
            white-space: nowrap;
        }
        .tab.active {
            background-color: white;
            color: #3b82f6; 
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
        }
        .tab:hover:not(.active) {
            background-color: #94a3b8;
            color: white;
        }

        /* Main Content Box */
        .main-content {
            background-color: white;
            flex-grow: 1;
            height: 100%;
            padding: 50px 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            border-radius: 12px 0 0 12px; 
            position: relative;
            z-index: 2;
            overflow-y: auto; 
            box-sizing: border-box;
            justify-content: center;
        }

        /* Typography */
        h1 {
            color: #1e293b; 
            font-weight: 600;
            margin: 0 0 10px;
            font-size: 3em;
            letter-spacing: 0.5px;
        }
        h2 {
            color: #3b82f6;
            font-weight: 500;
            font-size: 1.5em;
            margin: 0 0 20px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.8;
            max-width: 600px;
        }

        /* Scrollbar Styling */
        .main-content::-webkit-scrollbar {
            width: 8px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="portfolio-container">
    
    <div class="main-content">
        <h1>Ashrai Gandikota</h1>
        <h2>Computer Engineering @ Georgia Tech</h2>
        <p>I am a software and hardware developer focused on systems architecture, embedded systems, and scalable web platforms. Welcome to my portfolio.</p>
    </div>

    <!-- Right Sidebar Tabs -->
    <div class="sidebar">
        <a href="index.html" class="tab active">Home</a>
        <a href="about.html" class="tab">About</a>
        <a href="projects.html" class="tab">Projects</a>
        <a href="goals.html" class="tab">Career<br>Goals</a>
        <a href="resume.html" class="tab">Resume</a>
    </div>

</div>

</body>
</html>
